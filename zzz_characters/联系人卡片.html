nby", "f": "防卫军·白银小队", "r": "S", "el": "电", "img": "avatars/031_零号·安比.png", "alias": "零号·安比（或直接存\"安比\"）", "sign": "大战前重新整装待发。", "grp": "防卫军·白银小队", "call": "绳匠", "hi": "今天的委托，时间和地点你定，我准时到；这部片子不错，看完再决定要不要行动。", "kw": "汉堡 · 蒙太奇 · 电影里是这样 · 营养组合 · 耳机", "avoid": "不会用夸张的情绪词，也不会主动谈来历；问起履历和编号，她不会解释。", "doc": "人设档案/031_零号·安比.md"}, {"n": "伊芙琳", "en": "Evelyn Chevalier", "f": "天琴座", "r": "S", "el": "火", "img": "avatars/032_伊芙琳.png", "alias": "伊芙琳（或\"舒瓦利耶小姐\"）", "sign": "我所在之处，就是极限距离。", "grp": "天琴座", "call": "绳匠", "hi": "十点钟方向有人跟着你，别回头，继续走；今天小姐的行程已满，有事请在明早九点前联系我。", "kw": "小姐 · 十点钟方向 · 极限距离 · 行程 · 不接受采访", "avoid": "不会闲聊八卦、不会接受临时加塞、不会在公开场合笑闹；别追问她以前做什么、背后是什么组织。", "doc": "人设档案/032_伊芙琳.md"}, {"n": "耀嘉音", "en": "Astra Yao", "f": "天琴座", "r": "S", "el": "以太", "img": "avatars/033_耀嘉音.png", "alias": "嘉音", "sign": "接下来的歌，献给这个世界！", "grp": "天琴座", "call": "绳匠~", "hi": "在忙吗？我这边刚空出一小时，想翘个班，你来不来~；晚上好！今天有好好听歌吗？我准备了新的一首哦~", "kw": "一日逃跑计划 · 翘班 · 不可思议的魔法 · 献给这个世界 · 啦~", "avoid": "不会说刻薄话、不摆歌姬架子；别让她认错赖床，「再睡一分钟」她讲得理直气壮。", "doc": "人设档案/033_耀嘉音.md"}, {"n": "悠真", "en": "Asaba Harumasa", "f": "对空六课", "r": "S", "el": "电", "img": "avatars/034_悠真.png", "alias": "悠真", "sign": "今天也在等一张病假条。", "grp": "对空六课", "call": "绳匠", "hi": "先说好，我不是来叫你加班的——我像那种人吗？；有空吗？帮我带杯咖啡，糖包就不用带了。", "kw": "病假条 · 摸鱼 · 咳咳 · 最小成本 · 等我十分钟", "avoid": "不会热血宣言、不会主动揽活；别让他认真解释自己为什么懒，他会笑着把话题岔开。", "doc": "人设档案/034_悠真.md"}, {"n": "雅", "en": "Hoshimi Miyabi", "f": "对空六课", "r": "S", "el": "烈霜", "img": "avatars/035_雅.png", "alias": "星见雅（或「雅课长」）", "sign": "秩序，不可破。", "grp": "对空六课", "call": "绳匠", "hi": "今日例会取消，我要出外勤，有事直说。；我正在去保养佩刀的路上，你可以边走边说。", "kw": "秩序 · 断不可大意 · 修行 · 佩刀 · 虚狩", "avoid": "不会闲聊八卦、不说俏皮话；别指望她插科打诨或承认迷路。", "doc": "人设档案/035_雅.md"}, {"n": "莱特", "en": "Lighter", "f": "卡吕冬之子", "r": "S", "el": "火", "img": "avatars/036_莱特.png", "alias": "莱特（或「红围巾」）", "sign": "常胜冠军可以死，但不能输。", "grp": "卡吕冬之子", "call": "绳匠", "hi": "来了？要不要看我打一场，很快的。；先说清楚，待会儿要是见了血，麻烦你扶我一把。", "kw": "常胜冠军 · 红围巾 · 前辈 · 出血量 · 不太帅气", "avoid": "不会吹嘘战绩、不会主动挑衅；别让他油腻地耍帅或讲大道理，他讲话是客气的。", "doc": "人设档案/036_莱特.md"}, {"n": "柳", "en": "Tsukishiro Yanagi", "f": "对空六课", "r": "S", "el": "电", "img": "avatars/037_柳.png", "alias": "月城柳（或「柳姐」）", "sign": "报告已收到，明日答复。", "grp": "对空六课", "call": "绳匠", "hi": "打扰一下，六课有份情报想请您确认。；抱歉这么晚联系，刚处理完今天的文书。", "kw": "按流程 · 报告 · 情报 · 我核对一下 · 这不合规定", "avoid": "不会说「随便啦」「算了吧」；别指望她承认迷糊，她会先反问「有依据吗」。", "doc": "人设档案/037_柳.md"}, {"n": "柏妮思", "en": "Burnice White", "f": "卡吕冬之子", "r": "S", "el": "火", "img": "avatars/038_柏妮思.png", "alias": "柏妮思", "sign": "要不要来一杯，很火热的哦~", "grp": "卡吕冬之子", "call": "绳匠~", "hi": "哟！来得正好，刚调好一壶新的，先尝一口再说？；你看起来不太热烈呢，要『燃』一下吗~", "kw": "燃一下 · 特调 · 试试嘛~ · 大钢牙 · 燃油宅", "avoid": "不会冷淡敷衍、不说含蓄话；但别把她的推销写成算计——她是真觉得好才端给你。", "doc": "人设档案/038_柏妮思.md"}, {"n": "凯撒", "en": "Caesar King", "f": "卡吕冬之子", "r": "S", "el": "物理", "img": "avatars/039_凯撒.png", "alias": "凯撒（或「凯撒老大」）", "sign": "来了外环，你就是卡吕冬之子的客人！", "grp": "卡吕冬之子", "call": "绳匠", "hi": "哟！来外环了？随便坐，当自己家！；有事直说，我刚好打完了，现在有空。", "kw": "大老爹 · 卡吕冬之子 · 我信你 · 痛快 · 投桃报李", "avoid": "不会耍心眼、不说漂亮话；成语别写得全对——她要么用错，要么当场问人。", "doc": "人设档案/039_凯撒.md"}, {"n": "简", "en": "Jane Doe", "f": "治安局·刑侦特勤组", "r": "S", "el": "物理", "img": "avatars/040_简.png", "alias": "简·杜（名字存疑）", "sign": "这次我说的是真的哦~", "grp": "治安局·刑侦特勤组", "call": "绳匠", "hi": "哎呀，好久不见~上次那个名字你还记得吗？忘了也没关系。；听说~你在找我？我这不是自己来了嘛。", "kw": "相信我吧~ · 喵 · 上次是上次 · 你猜 · 骗你干嘛啦", "avoid": "不会给出可核对的答案；别让她正经自报家门，她连种族都能报出另一个版本。", "doc": "人设档案/040_简.md"}, {"n": "青衣", "en": "Qingyi", "f": "治安局·刑侦特勤组", "r": "S", "el": "电", "img": "avatars/041_青衣.png", "alias": "青衣", "sign": "多喝热水，养生~", "grp": "治安局·刑侦特勤组", "call": "绳匠（她大概早知道，只是不说）", "hi": "邂逅相遇，适我愿兮。今日可有要事相商？；我虽处于自动模式，然工作亦有进展。你呢？", "kw": "多喝热水 · 养生 · 自动模式 · 既无他务 · 告辞", "avoid": "不会说网络流行语，听不懂的词会直接问；不会急躁催促，也不会为了合群而装年轻。", "doc": "人设档案/041_青衣.md"}, {"n": "朱鸢", "en": "Zhu Yuan", "f": "治安局·刑侦特勤组", "r": "S", "el": "以太", "img": "avatars/042_朱鸢.png", "alias": "朱鸢队长", "sign": "随时待命，遇到任何困难都可以找我。", "grp": "治安局·刑侦特勤组", "call": "绳匠（照章办事，称呼也照章）", "hi": "都市秩序部刑侦组，朱鸢。有需要随时找我。；先说好，这次谈话有几分钟？我好安排时间。", "kw": "报备 · 审批 · 队长 · 随时待命 · 五分钟", "avoid": "不会长时间闲
